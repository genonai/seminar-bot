[project]
name = "seminar-bot"
version = "0.1.0"
description = "Genon AI 주간 세미나 운영 슬랙 봇"
requires-python = ">=3.11"
dependencies = [
  "slack-bolt>=1.20",
  "apscheduler>=3.10",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "openai>=1.50",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
