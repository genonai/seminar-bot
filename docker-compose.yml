services:
  bot:
    build: .
    image: seminar-bot:latest
    container_name: seminar-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # SQLite 영속 저장. 호스트의 ./data 가 컨테이너의 /var/lib/seminar-bot 으로 mount.
      - ./data:/var/lib/seminar-bot
    environment:
      # .env의 DB_PATH는 컨테이너 내부 경로여야 함 (호스트 경로 X)
      DB_PATH: /var/lib/seminar-bot/seminar.db
      TZ: Asia/Seoul
    ports:
      # debug API (localhost only on host → SSH 터널로 외부 접근).
      # 호스트 포트 18765 = 다른 앱들과 충돌 방지. 컨테이너는 8000 그대로.
      - "127.0.0.1:18765:8000"
    init: true
